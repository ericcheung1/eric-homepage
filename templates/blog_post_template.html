<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }} - Eric Cheung</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Guaranteed styling for injected Markdown tags -->
  <style type="text/tailwindcss">
    .blog-content p {
      @apply mb-5 leading-7;
    }
    .blog-content h3 {
      @apply text-xl font-extrabold mt-8 mb-3;
    }
    .blog-content h4 {
      @apply text-lg font-extrabold mt-6 mb-2;
    }
    .blog-content ul {
      @apply list-disc pl-5 mb-5 space-y-2;
    }
    .blog-content ol {
      @apply list-decimal pl-5 mb-5 space-y-2;
    }
    .blog-content a {
      @apply text-[#0000EE] underline;
    }
    .blog-content strong {
      @apply font-extrabold;
    }
    .blog-content code {
      @apply bg-[#EAEAE2] px-1.5 py-0.5 text-sm font-mono;
    }
    .blog-content pre {
      @apply bg-[#EAEAE2] border border-[#999999] p-4 mb-5 overflow-x-auto;
    }
    .blog-content pre code {
      @apply bg-transparent p-0;
    }
    .blog-content blockquote {
      @apply border-l-2 border-[#888888] pl-4 italic text-gray-700 mb-5;
    }
  </style>
</head>

<body
  class="bg-[#F7F7F2] text-black font-sans text-base"
  style="font-family: Arial, Verdana, sans-serif;"
>
  <div class="max-w-6xl mx-auto p-4 md:p-6">

    <!-- Header -->
    <header class="border-b-2 border-[#888888] pb-4 mb-6">
      <h1 class="text-4xl font-extrabold tracking-tight">
        <a href="index.html" class="hover:underline">Eric Cheung</a>
      </h1>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-[180px_1fr] gap-6">

      <!-- Sidebar -->
      <aside class="border-b border-gray-300 pb-4 md:border-b-0
                    md:border-r md:pr-4 md:pb-0">
        <h2 class="text-lg font-extrabold mb-3">
          Directory
        </h2>

        <nav class="flex flex-col items-start gap-3">
          <a href="index.html#about" class="text-[#0000EE] underline">About</a>
          <a href="index.html#experience" class="text-[#0000EE] underline">Experience</a>
          <a href="index.html#projects" class="text-[#0000EE] underline">Projects</a>
          <a href="index.html#interests" class="text-[#0000EE] underline">Interests</a>
          <a href="index.html#contact" class="text-[#0000EE] underline">Contact Info</a>
          <a href="index.html#blog" class="text-[#0000EE] underline">Blog</a>
        </nav>
      </aside>

      <!-- Main content -->
      <main class="min-w-0">
        <article>
          <!-- Blog Title & Date Header -->
          <div class="border-b border-[#999999] pb-2 mb-6">
            <h2 class="text-2xl font-extrabold">
              {{ title }}
            </h2>
            {% if date %}
            <p class="mt-2 text-sm text-gray-600 leading-5">
              {{ date }}
            </p>
            {% endif %}
          </div>

          <!-- Injected Markdown Content -->
          <div class="blog-content text-black">
            {{ content | safe }}
          </div>
        </article>
      </main>
    </div>

    <!-- Footer -->
    <footer class="border-t-2 border-[#888888] mt-10 pt-4
                   text-sm text-gray-800 text-center">
      <p>© 2026 Eric Cheung</p>
    </footer>

  </div>
</body>
</html>
